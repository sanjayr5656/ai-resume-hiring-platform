<svg viewBox="0 0 800 700" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0b3d3a" flood-opacity="0.16"/>
    </filter>
    <clipPath id="lensClip"><circle cx="480" cy="330" r="160"/></clipPath>
  </defs>

  <!-- soft background blobs -->
  <ellipse cx="400" cy="360" rx="330" ry="290" fill="#E3E8DC"/>
  <circle cx="120" cy="150" r="14" fill="#F26B4F" opacity=".35"/>
  <circle cx="710" cy="120" r="9" fill="#0E7570" opacity=".35"/>
  <circle cx="90" cy="420" r="8" fill="#0E7570" opacity=".25"/>

  <!-- résumé sheet (the "checklist") -->
  <g transform="rotate(-6 310 345)" filter="url(#sh)">
    <rect x="120" y="105" width="360" height="480" rx="24" fill="#fff"/>
    <circle cx="170" cy="160" r="22" fill="#E3E8DC"/>
    <rect x="205" y="146" width="140" height="12" rx="6" fill="#CFD6C8"/>
    <rect x="205" y="168" width="90" height="9" rx="4.5" fill="#E3E8DC"/>
    <g fill="#E3E8DC">
      <rect x="150" y="225" width="290" height="9" rx="4.5"/>
      <rect x="150" y="251" width="250" height="9" rx="4.5"/>
      <rect x="150" y="277" width="270" height="9" rx="4.5"/>
      <rect x="150" y="333" width="200" height="9" rx="4.5"/>
      <rect x="150" y="359" width="260" height="9" rx="4.5"/>
      <rect x="150" y="385" width="230" height="9" rx="4.5"/>
      <rect x="150" y="441" width="280" height="9" rx="4.5"/>
      <rect x="150" y="467" width="190" height="9" rx="4.5"/>
    </g>
  </g>

  <!-- lens handle -->
  <line x1="598" y1="448" x2="690" y2="560" stroke="#0A5A56" stroke-width="38" stroke-linecap="round"/>
  <line x1="598" y1="448" x2="690" y2="560" stroke="#0E7570" stroke-width="26" stroke-linecap="round"/>

  <!-- lens body -->
  <g filter="url(#sh)">
    <circle cx="480" cy="330" r="172" fill="#FFF7EE"/>
  </g>
  <g clip-path="url(#lensClip)">
    <circle cx="480" cy="330" r="160" fill="#FFF3E6"/>
    <!-- warm glow -->
    <circle cx="540" cy="270" r="110" fill="#FBD9C8" opacity=".6"/>
    <!-- career path -->
    <path d="M340 440 C400 400 380 340 450 360 S560 300 610 230" fill="none" stroke="#0E7570" stroke-width="5" stroke-dasharray="2 12" stroke-linecap="round"/>
    <!-- person -->
    <circle cx="430" cy="255" r="34" fill="#F4C7A8"/>
    <path d="M430 215 a34 30 0 0 1 34 28 q-18 -16 -68 -4 a34 30 0 0 1 34 -24z" fill="#2B3A38"/>
    <path d="M372 345 q0 -52 58 -52 q58 0 58 52 z" fill="#0E7570"/>
    <!-- milestones -->
    <circle cx="340" cy="440" r="12" fill="#fff" stroke="#0E7570" stroke-width="5"/>
    <circle cx="391" cy="378" r="10" fill="#0E7570"/>
    <circle cx="538" cy="329" r="10" fill="#F26B4F"/>
    <circle cx="610" cy="230" r="16" fill="#F26B4F"/>
    <path d="M603 238 v-18 l16 6 l-16 6" fill="#fff"/>
  </g>
  <!-- lens ring + glare -->
  <circle cx="480" cy="330" r="166" fill="none" stroke="#0E7570" stroke-width="16"/>
  <path d="M358 250 a140 140 0 0 1 80 -82" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".7"/>

  <!-- sparkle badge -->
  <circle cx="660" cy="190" r="56" fill="#F26B4F" opacity=".25"/>
  <circle cx="660" cy="190" r="42" fill="#F26B4F"/>
  <path d="M660 168 q3 18 22 22 q-19 4 -22 22 q-3 -18 -22 -22 q19 -4 22 -22z" fill="#fff"/>
  <path d="M684 206 q1 6 7 7 q-6 1 -7 7 q-1 -6 -7 -7 q6 -1 7 -7z" fill="#fff"/>

  <!-- floating chips -->
  <g filter="url(#sh)">
    <rect x="90" y="500" width="210" height="62" rx="31" fill="#fff"/>
    <circle cx="124" cy="531" r="16" fill="#E3F1EE"/>
    <path d="M116 531 l6 6 l11 -12" fill="none" stroke="#0E7570" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="152" y="526" font-size="15" fill="#2B3A38" font-weight="bold">92% match</text>
    <text x="152" y="546" font-size="12" fill="#6B7A76">skills + story</text>
  </g>
  <g filter="url(#sh)" transform="rotate(4 220 120)">
    <rect x="110" y="92" width="196" height="54" rx="27" fill="#0E7570"/>
    <circle cx="140" cy="119" r="7" fill="#F26B4F"/>
    <text x="158" y="125" font-size="15" fill="#fff" font-style="italic">more than a résumé</text>
  </g>
</svg>
